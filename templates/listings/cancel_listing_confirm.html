{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm rounded-4 p-4 text-center">
        <div class="metric-icon bg-danger bg-opacity-10 text-danger mx-auto mb-3">
          <i class="bi bi-exclamation-triangle-fill fs-3"></i>
        </div>
        <h4 class="fw-bold text-danger mb-2">Cancel Food Listing?</h4>
        <p class="text-secondary small mb-4">
          Are you sure you want to cancel listing <strong>#{{ listing.listing_id }} - {{ listing.food_type }}</strong>? Once cancelled, nearby NGOs will no longer see this batch.
        </p>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3 text-start">
            <label class="form-label small fw-semibold text-secondary">Reason for cancellation (Optional)</label>
            <input type="text" name="reason" class="form-control" placeholder="e.g. Consumed internally / accidentally listed">
          </div>

          <div class="d-flex gap-2 justify-content-center">
            <a href="{% url 'listings:my_listings' %}" class="btn btn-outline-secondary px-4 fw-semibold">Keep Listing</a>
            <button type="submit" class="btn btn-danger px-4 fw-bold">Confirm Cancellation</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
